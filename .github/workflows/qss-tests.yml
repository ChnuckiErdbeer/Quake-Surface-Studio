name: QSS Python tests

on:
  push:
    paths:
      - "quake_surface_studio (zip me for blender)/**"
      - ".github/workflows/qss-tests.yml"
  pull_request:
    paths:
      - "quake_surface_studio (zip me for blender)/**"
      - ".github/workflows/qss-tests.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        working-directory: "quake_surface_studio (zip me for blender)"
        run: python -m compileall -q .
      - name: Run standalone tests
        working-directory: "quake_surface_studio (zip me for blender)"
        run: python -m unittest discover -s tests -v
      - name: Build versioned Blender install ZIP
        run: |
          mkdir -p dist/quake_surface_studio
          cp -a "quake_surface_studio (zip me for blender)/." dist/quake_surface_studio/
          rm -rf dist/quake_surface_studio/tests dist/quake_surface_studio/__pycache__
          cd dist
          zip -qr "../Quake-Surface-Studio-v0.11.3.zip" quake_surface_studio
      - name: Upload Blender install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Quake-Surface-Studio-v0.11.3
          path: Quake-Surface-Studio-v0.11.3.zip
          if-no-files-found: error

      - name: Package Blender install ZIP
        if: success()
        run: |
          cd "quake_surface_studio (zip me for blender)"
          zip -r ../Quake-Surface-Studio-v0.11.4-install.zip . -x "*/__pycache__/*" "*.pyc"
      - name: Upload Blender install ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Quake-Surface-Studio-v0.11.4-install
          path: Quake-Surface-Studio-v0.11.4-install.zip
          if-no-files-found: error
          retention-days: 30
