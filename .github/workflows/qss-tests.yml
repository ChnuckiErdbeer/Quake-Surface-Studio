name: QSS Python tests

on:
  push:
    paths:
      - "quake_surface_studio (zip me for blender)/**"
      - ".github/workflows/qss-tests.yml"
  pull_request:
    paths:
      - "quake_surface_studio (zip me for blender)/**"
      - ".github/workflows/qss-tests.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        working-directory: "quake_surface_studio (zip me for blender)"
        run: python -m compileall -q .
      - name: Run standalone tests
        working-directory: "quake_surface_studio (zip me for blender)"
        run: python -m unittest discover -s tests -v
