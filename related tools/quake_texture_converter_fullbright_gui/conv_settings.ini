; Quake texture converter settings
; Edit these values, save the file, then run conv_layers.py.
; Command-line options override values in this file.
;
; Quick guidance:
;   segments:       lower = larger color regions; higher = finer segmentation
;   compactness:    higher = more regular/compact regions
;   detail:         higher = stronger preservation of subtle surface detail
;   detail_radius:  larger = detail enhancement over broader scales
;   coherence:      higher = neighboring zones more likely to share a palette ramp
;   material_merge_threshold: higher = adjacent base regions merge more readily
;   material_luminance_weight: lower = painted highlights/shadows affect material identity less
;   material_chroma_limit: maximum chroma difference allowed when merging regions
;   ramp_candidates_per_zone: best-fit ramp families available within each zone
;
; The converter first creates SLIC superpixels, then merges adjacent ones into
; larger material zones. Ramp fitting considers the zone color distribution, and
; pixels may choose among its best-fit ramps to preserve painted hue variation.
; The low luminance weight is intentional for game textures with baked lighting.

[conversion]
palette = quake.pal
ramps = neutral,dark_earth,blue_grey,olive_dark,red,ochre,warm_earth,tan,purple_dark,purple_warm,stone,green_grey,yellow_ochre,blue
fullbright_start = 224
segments = 180
compactness = 10.0
detail = 0.35
detail_radius = 1.2
coherence = 0.025
material_merge_threshold = 0.055
material_luminance_weight = 0.20
material_chroma_limit = 0.075
ramp_candidates_per_zone = 3
alpha_threshold = 128
color_key_tolerance = 0

; Transparency: alpha below alpha_threshold becomes palette index 255.
; For sources without alpha, optionally pass --color-key RRGGBB.
; color_key_tolerance is a per-channel RGB tolerance (0 = exact match).

; Automatically detect sibling <texture>_fullbrights.png masks (white = fullbright).
fullbright_masks = true
